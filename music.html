<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music | Precognition</title>
  <meta name="description" content="Stream Precognition's latest sonic rituals. Listen to our music and explore the signal." />
  <!-- Font loading -->
  
  <style>
  body {
    margin: 0;
    padding: 0;
    font-family: 'Cinzel', serif;
    background-color: #111;
    color: #eee;
    line-height: 1.6;
  }

  header {
    background-color: #000;
    padding: 20px;
    text-align: center;
  }

  header h1 {
    margin: 0;
    font-size: 2.5em;
    color: #fff;
  }

  nav {
    margin-top: 10px;
  }

  nav a {
    color: #ccc;
    text-decoration: none;
    margin: 0 15px;
    font-weight: bold;
  }

  nav a:hover {
    color: #fff;
  }

  .music-section {
    padding: 40px 20px;
    text-align: center;
  }

  .music-section h2 {
    font-size: 2em;
    margin-bottom: 10px;
    color: #fff;
  }

  .music-section p {
    font-size: 1.1em;
    margin-bottom: 30px;
    color: #ccc;
  }

  audio {
    width: 100%;
    max-width: 600px;
    margin: 20px auto;
    display: block;
  }

  .stream-links {
    margin: 30px 0;
  }

  .stream-links a {
    display: inline-block;
    margin: 10px;
    padding: 10px 20px;
    background-color: #222;
    color: #eee;
    border: 1px solid #444;
    border-radius: 5px;
    text-decoration: none;
  }

  .stream-links a:hover {
    background-color: #444;
  }

  .coming-soon {
    margin-top: 40px;
  }

  .coming-soon h3 {
    color: #fff;
    margin-bottom: 15px;
  }

  .coming-soon img {
    max-width: 100%;
    height: auto;
    border: 2px solid #333;
    border-radius: 8px;
  }

  footer {
    background-color: #000;
    color: #888;
    text-align: center;
    padding: 20px;
    margin-top: 40px;
  }
</style>

</head>
<body>
  <header>
    <h1>Precognition</h1>
    <nav>
      <a href="/">Home</a>
      <a href="/music">Music</a>
      <a href="/gallery">Gallery</a>
      <a href="/contact">Contact</a>
    </nav>
  </header>

  <section class="music-section">
    <h2>Sound Before Impact</h2>
    <p>Stream our latest sonic transmissions. Every track is a signal. Every signal is a prophecy.</p>

    <audio controls>
      <source src="/audio/signal-decay.mp3" type="audio/mpeg" />
      Your browser does not support the audio element.
    </audio>

    <div class="stream-links">
      <a href="https://officialprecognition.bandcamp.com" target="_blank">Bandcamp</a>
      <a href="https://soundcloud.com/precognition-official" target="_blank">SoundCloud</a>
      <a href="https://www.youtube.com/@PrecognitionOfficial" target="_blank">YouTube</a>
    </div>

    <div class="coming-soon">
      <h3>"Promise" Coming Soon!</h3>
      <img src="C.jpg" alt="Promise cover art" />
    </div>
  </section>

  <footer>
    &copy; 2025 Precognition. All rights reserved.
  </footer>
</body>
</html>
