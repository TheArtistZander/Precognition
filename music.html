<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music | Precognition</title>
  <meta name="description" content="Stream Precognition's latest sonic rituals. Listen to our music and explore the signal." />
  <link rel="stylesheet" href="/canvas.css" />
  <style>
    body {
      margin: 0;
      font-family: 'Cinzel', serif;
      background-color: #0a0a0a;
      color: #cc0000;
    }

    header {
      background-color: #000;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #cc0000;
    }

    header h1 {
      font-size: 2em;
      margin: 0;
      text-shadow: 2px 2px 4px #000;
    }

    nav a {
      color: #cc0000;
      text-decoration: none;
      margin-left: 20px;
      font-weight: bold;
      font-size: 1em;
    }

    .music-section {
      padding: 60px 40px;
      max-width: 1000px;
      margin: auto;
      text-align: center;
    }

    .music-section h2 {
      font-size: 2.5em;
      margin-bottom: 30px;
      font-family: 'Engravers Old English', serif;
      text-transform: uppercase;
      border-bottom: 1px solid #cc0000;
      padding-bottom: 10px;
    }

    audio {
      width: 100%;
      max-width: 600px;
      margin: 20px auto;
      display: block;
      filter: invert(100%) grayscale(100%);
      border: 2px solid #cc0000;
      border-radius: 8px;
      box-shadow: 0 0 15px rgba(204, 0, 0, 0.6);
    }

    .stream-links {
      margin-top: 30px;
    }

    .stream-links a {
      display: inline-block;
      margin: 10px;
      padding: 10px 20px;
      background-color: #cc0000;
      color: #fff;
      text-decoration: none;
      font-family: 'Cinzel', serif;
      border-radius: 6px;
      box-shadow: 0 0 10px #cc0000;
      transition: transform 0.2s ease;
    }

    .stream-links a:hover {
      transform: scale(1.05);
    }

    footer {
      background-color: #000;
      color: #cc0000;
      text-align: center;
      padding: 20px;
      font-size: 0.9em;
      border-top: 2px solid #cc0000;
      font-family: 'Engravers Old English', serif;
    }
  </style>
</head>
<body>
  <header>
    <h1>Precognition</h1>
    <nav>
      <a href="/">Home</a>
      <a href="/music">Music</a>
      <a href="/gallery">Gallery</a>
      <a href="/contact">Contact</a>
    </nav>
  </header>

  <section class="music-section">
    <h2>Sound Before Impact</h2>
    <p>Stream our latest sonic transmissions. Every track is a signal. Every signal is a prophecy.</p>

    <audio controls>
      <source src="/audio/signal-decay.mp3" type="audio/mpeg" />
      Your browser does not support the audio element.
    </audio>

    <div class="stream-links">
      <a href="https://officialprecognition.bandcamp.com" target="_blank">Bandcamp</a>
      <a href="https://soundcloud.com/precognition-official" target="_blank">SoundCloud</a>
      <a href="https://www.youtube.com/@PrecognitionOfficial" target="_blank">YouTube</a>
    </div>
  </section>

  <footer>
    &copy; 2025 Precognition. All rights reserved.
  </footer>
</body>
</html>
