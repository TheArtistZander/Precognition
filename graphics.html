<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Official Precognition Graphics</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #111;
      color: #eee;
      margin: 0;
      padding: 0;
    }

    header {
      text-align: center;
      padding: 2rem;
      background-color: #222;
    }

    header h1 {
      margin-bottom: 0.5rem;
      font-size: 2.5rem;
    }

    header p {
      font-size: 1.2rem;
      color: #ccc;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1rem;
      padding: 2rem;
    }

    .graphic-item {
      background-color: #1a1a1a;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
      transition: transform 0.3s;
    }

    .graphic-item img {
      width: 100%;
      display: block;
      border-bottom: 1px solid #333;
      cursor: pointer;
    }

    .graphic-item:hover {
      transform: scale(1.03);
    }

    .graphic-item p {
      padding: 0.5rem 1rem;
      font-size: 1rem;
      color: #bbb;
    }

    footer {
      text-align: center;
      padding: 1rem;
      background-color: #222;
      font-size: 0.9rem;
      color: #888;
    }

    /* Lightbox Styles */
    .lightbox {
      display: none;
      position: fixed;
      z-index: 999;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.9);
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    .lightbox-img {
      max-width: 90%;
      max-height: 80%;
      margin: auto;
      border-radius: 8px;
    }

    .close {
      position: absolute;
      top: 20px; right: 30px;
      font-size: 2rem;
      color: #fff;
      cursor: pointer;
    }

    .nav {
      position: absolute;
      top: 50%;
      font-size: 3rem;
      color: #fff;
      cursor: pointer;
      user-select: none;
      padding: 0 20px;
    }

    .prev { left: 0; }
    .next { right: 0; }
  </style>
</head>
<body>
  <header>
    <h1>Official Precognition Graphics</h1>
    <p>Explore and download visuals from the Precognition universe</p>
  </header>

  <section class="gallery">
    <div class="graphic-item"><img src="graphic1.jpg" alt="Graphic 1"><p>Precognition</p></div>
    <div class="graphic-item"><img src="graphic2.jpg" alt="Graphic 2"><p>Sound Before Impact</p></div>
    <div class="graphic-item"><img src="graphic3.jpg" alt="Graphic 3"><p>Zander </p></div>
    <div class="graphic-item"><img src="graphic4.jpg" alt="Graphic 4"><p>Minneapolis </p></div>
    <div class="graphic-item"><img src="graphic5.jpg" alt="Graphic 5"><p>Minnesota Band</p></div>
    <div class="graphic-item"><img src="graphic6.jpg" alt="Graphic 6"><p>Official Precognition</p></div>
     </section>

  <!-- Lightbox Modal -->
  <div id="lightbox" class="lightbox">
    <span class="close">&times;</span>
    <img class="lightbox-img" src="" alt="">
    <div class="nav prev">&#10094;</div>
    <div class="nav next">&#10095;</div>
  </div>

  <footer>
    <p>© 2025 Official Precognition. All rights reserved.</p>
  </footer>

  <script>
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.querySelector('.lightbox-img');
    const closeBtn = document.querySelector('.close');
    const nextBtn = document.querySelector('.next');
    const prevBtn = document.querySelector('.prev');
    const images = document.querySelectorAll('.graphic-item img');

    let currentIndex = 0;

    function showLightbox(index) {
      currentIndex = index;
      lightboxImg.src = images[index].src;
      lightbox.style.display = 'flex';
    }

    images.forEach((img, i) => {
      img.addEventListener('click', () => showLightbox(i));
    });

    closeBtn.addEventListener('click', () => {
      lightbox.style.display = 'none';
    });

    nextBtn.addEventListener('click', () => {
      currentIndex = (currentIndex + 1) % images.length;
      lightboxImg.src = images[currentIndex].src;
    });

    prevBtn.addEventListener('click', () => {
      currentIndex = (currentIndex - 1 + images.length) % images.length;
      lightboxImg.src = images[currentIndex].src;
    });

    document.addEventListener('keydown', (e) => {
      if (lightbox.style.display === 'flex') {
        if (e.key === 'ArrowRight') nextBtn.click();
        if (e.key === 'ArrowLeft') prevBtn.click();
        if (e.key === 'Escape') closeBtn.click();
      }
    });
  </script>
</body>
</html>
