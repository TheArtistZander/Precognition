<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connect With Official Precognition</title>
  
  <!-- Gothic Font -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cormorant+Garamond&display=swap" rel="stylesheet" />

  <style>
    body {
      margin: 0;
      padding: 2rem;
      background-color: #0b0b0b;
      color: #ccc;
      font-family: 'Cormorant Garamond', serif;
    }

    h1 {
      font-family: 'Cinzel Decorative', serif;
      text-align: center;
      font-size: 2.8rem;
      color: #e00e4f;
      text-shadow: 0 0 12px #e00e4f;
      margin-bottom: 0.5rem;
    }

    p {
      text-align: center;
      font-size: 1.2rem;
      color: #999;
      margin-bottom: 2rem;
    }

    .about {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.5rem;
    }

    .about a {
      background-color: #111;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 1rem;
      text-align: center;
      width: 160px;
      color: #ccc;
      text-decoration: none;
      box-shadow: 0 0 8px rgba(255, 0, 80, 0.3);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .about a:hover {
      transform: scale(1.05);
      box-shadow: 0 0 12px rgba(255, 0, 80, 0.6);
      color: #fff;
    }

    .about img {
      width: 40px;
      height: 40px;
      margin-bottom: 0.5rem;
      filter: brightness(0.8);
    }

    .hero-images {
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .hero-images img {
      width: 100%;
      max-width: 400px;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 0 12px rgba(255, 0, 80, 0.4);
    }

    @media (max-width: 600px) {
      .about a {
        width: 120px;
        padding: 0.8rem;
      }

      h1 {
        font-size: 2rem;
      }

      p {
        font-size: 1rem;
      }

      .hero-images img {
        max-width: 100%;
      }
    }
  </style>
  <script src="https://elfsightcdn.com/platform.js" async></script>
</head>
<body>

  <h1>Connect With Us</h1>
  <p>Explore Official Precognition across platforms—where foresight meets creativity.</p>

  <div class="about">
    <a href="https://www.instagram.com/OfficialPrecognition/" target="_blank" rel="me">
      <img src="instagram-icon.png" alt="Instagram">
      Instagram
    </a>
    <a href="https://www.facebook.com/officialprecognition" target="_blank" rel="me">
      <img src="facebook-icon.png" alt="Facebook">
      Facebook
    </a>
    <a href="https://www.youtube.com/@PrecognitionOfficial" target="_blank" rel="me">
      <img src="youtube-icon.png" alt="YouTube">
      YouTube
    </a>
    <a href="https://www.tiktok.com/@officialprecognition" target="_blank" rel="me">
      <img src="tiktok-icon.png" alt="TikTok">
      TikTok
    </a>
    <a href="https://www.pinterest.com/officialprecognition/_pins/" target="_blank" rel="me">
      <img src="pinterest-icon.png" alt="Pinterest">
      Pinterest
    </a>
    <a href="https://www.threads.com/@officialprecognition" target="_blank" rel="me">
      <img src="threads-icon.png" alt="Threads">
      Threads
    </a>
    <a href="https://officialprecognition.bandcamp.com/" target="_blank" rel="me">
      <img src="bandcamp-icon.png" alt="Bandcamp">
      Bandcamp
    </a>
    <a href="https://soundcloud.com/precognition-official" target="_blank" rel="me">
      <img src="soundcloud-icon.png" alt="SoundCloud">
      SoundCloud
    </a>
      <a href="https://music.apple.com/us/artist/precognition/1833159886" target="_blank" rel="me">
      <img src="soundcloud-icon.png" alt="iTunes">
      iTunes
    </a>
  </div>
  <div class="hero-images">
    <img src="Me.jpg" alt="Precognition Banner">
    <img src="Me.jpg" alt="Precognition Logo">
  </div>
