  <section id="bio">
    <h2>About Zander</h2>
    <p>Zander, born Jacob Alexander Figueroa in Saint Paul, Minnesota, is a visionary multimedia artist whose work spans body painting, photography, mixed media, and music. His art has been featured at <strong>NY Fashion Week</strong>, <strong>Summerset Music Festival</strong>, and in <strong>NY Arts Magazine</strong>.</p>
    <p>He co-founded <a href="https://bandfamous.com/art" target="_blank">The Band Famous</a>, a revolutionary art and music collective known for creating the first interactive app album. Zander’s work blends visual storytelling with live performance, pushing the boundaries of contemporary art.</p>
  </section>

    <h2>Artistic Highlights</h2>
    <ul>
      <li>🎥 Featured in the documentary <em>All Over the Walls</em> (MSP International Film Festival)</li>
      <li>🏛️ Founder of Karnak Gallery & Studio in Minneapolis</li>
      <li>🎨 Consultant for Game Show Network’s <em>Skin Wars</em></li>
      <li>🎶 Live body painting for Paul Van Dyk, Benny Benassi, MN Gay Pride</li>
      <li>🖼️ Exhibited in Montreal’s FIMA and alongside Emre Erturk, Gigi Turker, Gulay Alpay</li>
    </ul>
    <img src="zander-live-painting.jpg" alt="Zander performing live body painting at NY Fashion Week">
  </section>

  <section id="music">
    <h2>The Band Famous</h2>
    <p>As co-creator of The Band Famous, Zander fuses electronic music with immersive art. He plays violin and synthesizers, contributing to the band’s signature EDM sound. Their performances often include live painting, projection art, and interactive installations.</p>
    <p>Notable events include the “Live + Follow Your Dreams” Benefit Festival, supporting homeless youth and showcasing emerging artists.</p>
    <img src="band-famous-performance.jpg" alt="Zander performing with The Band Famous in a multimedia show">
